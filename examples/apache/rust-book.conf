# Example Apache VirtualHost for Rust-Book.
# Windows/XAMPP example paths are shown. On Linux, replace paths and logs.

<VirtualHost *:80>
    ServerName rust-book.local
    DocumentRoot "C:/xampp/htdocs/rust-book/public"

    ErrorLog  "logs/rust-book-error.log"
    CustomLog "logs/rust-book-access.log" combined

    <Directory "C:/xampp/htdocs/rust-book">
        Require all denied
    </Directory>

    <Directory "C:/xampp/htdocs/rust-book/public">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
</VirtualHost>

# For HTTPS, create an SSL VirtualHost for the same DocumentRoot and certificate.
# Do not point Apache at the repository root.
