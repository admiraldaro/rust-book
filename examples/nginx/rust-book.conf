# Example nginx site for Rust-Book.
# Replace placeholders before use:
#   rust-book.example.com
#   /var/www/rust-book
#   /run/php/php-fpm-rust-book.sock
#
# HSTS is intentionally not enabled here.

server {
    listen 80;
    server_name rust-book.example.com;
    root /var/www/rust-book/public;

    access_log /var/log/nginx/rust-book.access.log;
    error_log  /var/log/nginx/rust-book.error.log;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    # For a custom RustDesk API HTTPS port, use for example:
    # listen 21113 ssl http2;

    server_name rust-book.example.com;
    root /var/www/rust-book/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/rust-book.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rust-book.example.com/privkey.pem;

    access_log /var/log/nginx/rust-book.access.log;
    error_log  /var/log/nginx/rust-book.error.log;

    client_max_body_size 1m;

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm-rust-book.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_PORT 443;
        # For a custom HTTPS port, use the external port:
        # fastcgi_param SERVER_PORT 21113;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 30s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known/acme-challenge/) {
        deny all;
    }

    location ~ ^/(config|data|src|templates|scripts|tests|docs|examples)(/|$) {
        return 404;
    }
}
