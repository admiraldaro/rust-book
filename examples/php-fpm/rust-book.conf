; Example dedicated PHP-FPM pool for Rust-Book.
; Adjust paths, user, group, and PHP-FPM service name for your OS.

[rust-book]
user = rust-book
group = rust-book

listen = /run/php/php-fpm-rust-book.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500

chdir = /var/www/rust-book
catch_workers_output = yes

php_admin_value[error_log] = /var/log/php-fpm/rust-book.error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

php_admin_value[session.save_path] = /var/lib/rust-book/sessions
php_admin_value[upload_tmp_dir] = /var/lib/rust-book/tmp

env[RUSTDESK_API_DATABASE_PATH] = /var/lib/rust-book/rust-book.sqlite3
